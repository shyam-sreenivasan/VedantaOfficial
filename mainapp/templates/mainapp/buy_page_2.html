<style>
/*
COLORS - SAND: #CCC5B9, DARK BROWN: #252422, BLUE: #577590
*/

@import url('https://fonts.googleapis.com/css?family=Roboto+Slab&display=swap');

* {
  padding: 0;
  margin: 0;
  box-sizing: border-box;
}

html {
  font-family: "Roboto", sans-serif;
  font-size: 12px;
  color: #fff;
}

body {

}

.wrapper {
  height: 100vh;
  position: relative;
  background-color: #ccc5b9;
}

.card {
  max-width: 65rem;
  position: relative;
  display: flex;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  box-shadow: -2rem 2rem 3.2rem rgba(0, 0, 0, 0.2);
  flex-wrap: wrap;
}

.product-left {
  height: 100%;
  width: 100%;
  padding: 4rem 2rem;
  border-top-left-radius: 0.5rem;
  border-bottom-left-radius: 0.5rem;
  display: flex;
  flex-direction: column;
  background: #333;
  color: #fff;
}

.product-right {
  background: #fff;
  height: auto;
  width: 100%;
  color: #000;

  justify-content: left;
  align-items: left;
}

.product-right img {

}

.header h1 {
  text-transform: uppercase;
  margin: 2rem 0;
   font-size: 2.5rem;
}

/* Price */

.header h2 {
  margin: 0rem 0 2rem 0;
  font-weight: 300;
  }

/* Product Description */

.product-main p {
  opacity: 0.5;
  margin: 2rem 0;
  line-height: 1.45;
}

.focus {
  text-transform: uppercase;
  margin: 0 0 1rem 0;
  padding: 0 0 0.9rem 0;
  border-bottom: 0.2rem solid rgba(250, 250, 250, 0.3);
}

.focus span:last-child {
  margin: 0 0 0 1rem;
  width: 100%;
}

.focus span:first-child {
  border-bottom: 0.2rem solid #fff;
  padding: 0 0 0.9rem 0;
}

/* Choose color / quantity  */

.btns-group {
  width: 100%;
  margin: 0 0 2rem 0;
}

/* Total Price  */

.product-total {
  margin: 0 0 2rem 0;
}

.product-total p {
  font-weight: 700;
  font-size: 2rem;
  opacity: 0.5;
}

.product-total h3{
  margin: 0 0 1rem 0;
}


/* Add to cart button  */

.product-add {
  border: 1px solid #fff;
  width: 100%;
  padding: 1.5rem;
  border-radius: 5rem;
  transition: all 0.5s ease-out;
}

.product-add:hover {
  background-color: #fff;
  color: #2e282a;
}

.product-btns button {
  text-decoration: none;
  color: white;
  background-color: green;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  justify-content: center;
}
.styled-table {
    border-collapse: collapse;
    margin: 25px 0;
    font-size: 0.9em;
    font-family: sans-serif;
    min-width: 400px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
    margin-top: 5px;
    margin: 10px;
}

.styled-table thead tr {
    background-color: #009879;
    color: #ffffff;
    text-align: left;
}

.styled-table th,
.styled-table td {
    padding: 12px 15px;
}

.styled-table tbody tr {
    border-bottom: 1px solid #dddddd;
}

.styled-table tbody tr:nth-of-type(even) {
    background-color: #f3f3f3;
}

.styled-table tbody tr:last-of-type {
    border-bottom: 2px solid #009879;
}

.styled-table tbody tr.active-row {
    font-weight: bold;
    color: #009879;
}


</style>


<div class="wrapper">
  <div class="card">


      <div class="product-left">
      <div class="header">
        <h3>Ramayana Summer Camp</h3>
        <h2>{{pref}}</h2>
      </div>
      <!--DESCRIPITON / DETAILS-->
      <div class="product-main">
        <div class="focus">
<!--          <span>Description</span>-->
          <span>Participant Details</span>
        </div>
      </div>


      {% csrf_token %}
          <div class="row">

        <div class="row">
          <div class="col-50">
              <label><p style="color: yellow;">Child's name:</p> {{child}}</label>

              <label><p style="color: yellow;">Parent's name:</p> {{name}}</label>

              <label><p style="color: yellow;">Child's Grade:</p>  {{grade}}</label>

              <label><p style="color: yellow;">Email:</p> {{email}}</label>
              <label><p style="color: yellow;">Phone:</p> {{phone}}</label>

              <label><p style="color: yellow;">City,State,Country:</p>  {{city}}</label>
            <label></label>
              <br>
              <br>
            </div>
<!--            <input type="submit" value="Continue to payment" class="btn">-->

          </div>
<!--      </form>-->

  </div>



    </div>
<div class="product-right">
<h3 style="margin-top: 10px; text-align: center;">Payment (Paypal or Credit Card)</h3>
    <center>
<table class="styled-table">
    <thead>
        <tr>
            <th>Item</th>
            <th>Price</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Ramayana Summer Camp(Regular Price)</td>
            <td>$149.00</td>
        </tr>

        <tr>
            <td>Service charges</td>
            <td>$3.26</td>
        </tr>
        <tr>
            <td>Early-bird discount</td>
            <td>-$50.00</td>
        </tr>
        <tr class="active-row">
            <td>Total due today</td>
            <td>$102.26</td>
        </tr>
        <!-- and so on... -->
    </tbody>
</table> </center>
          <br>
<form action="https://www.paypal.com/cgi-bin/webscr" method="post" target="_top">
<input type="hidden" name="cmd" value="_s-xclick">
<input type="hidden" name="hosted_button_id" value="2WF39SDU3J56C">
<center><input type="image" src="{% static 'mainapp/icons/paypalbtn.png' %}"  width=250 name="submit" alt="PayPal - The safer, easier way to pay online!"></center>
<img alt="" border="0" src="https://www.paypalobjects.com/en_US/i/scr/pixel.gif" width="1" height="1">
</form>
    </div>



  </div>

</div>

</body>

</html>
